apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-tenants-and-gateway
  namespace: authorizer
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tenant-a
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tenant-b
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-ingress
      ports:
        - protocol: TCP
          port: 8080
---
