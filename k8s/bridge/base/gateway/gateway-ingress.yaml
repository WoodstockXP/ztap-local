apiVersion: apps/v1
kind: Deployment
metadata:
  name: ztap-gateway
  namespace: gateway-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ztap-gateway
  template:
    metadata:
      labels:
        app: ztap-gateway
    spec:
      nodeSelector:
        ztap.io/node-pool: security-control
      containers:
        - name: ztap-gateway
          image: ztap-app:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8001"]
          env:
            - name: ZTAP_KEYCLOAK_ISSUER
              value: http://keycloak.authorizer.svc.cluster.local:8080/realms/ztap
            - name: ZTAP_CLIENT_ID
              value: ztap-gateway
            - name: ZTAP_AGENT_ID
              value: invoice-agent-v2
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: ztap-gateway
  namespace: gateway-ingress
spec:
  selector:
    app: ztap-gateway
  ports:
    - port: 8001
      targetPort: 8001
