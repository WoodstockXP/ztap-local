apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: authorizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      nodeSelector:
        ztap.io/node-pool: shared-services
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:latest
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm-import
          configMap:
            name: ztap-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: authorizer
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
